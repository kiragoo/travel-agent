{% extends "base.html" %}

{% block title %}聊天 - 旅游助手{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card slide-up">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">
                        <i class="bi bi-chat-dots me-2"></i>与旅游助手聊天
                    </h5>
                    <span class="badge bg-primary">在线</span>
                </div>
                <div class="card-body">
                    <div id="chat-messages" class="mb-3">
                        <div class="message assistant-message fade-in">
                            <div class="d-flex align-items-center mb-2">
                                <i class="bi bi-robot me-2"></i>
                                <strong>旅游助手</strong>
                            </div>
                            <p class="mb-0">您好！我是您的旅游助手，很高兴为您服务。请问有什么可以帮您的吗？</p>
                        </div>
                    </div>
                    <form id="chat-form" class="mt-3">
                        <div class="input-group">
                            <input type="text" id="message-input" class="form-control" 
                                   placeholder="输入您的问题..." 
                                   aria-label="消息输入框">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-send me-2"></i>发送
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const chatMessages = document.getElementById('chat-messages');

    function addMessage(message, isUser = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'} fade-in`;
        
        const icon = isUser ? 'bi-person' : 'bi-robot';
        const name = isUser ? '您' : '旅游助手';
        
        messageDiv.innerHTML = `
            <div class="d-flex align-items-center mb-2">
                <i class="bi ${icon} me-2"></i>
                <strong>${name}</strong>
            </div>
            <p class="mb-0">${message}</p>
        `;
        
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const message = messageInput.value.trim();
        if (!message) return;

        // 添加用户消息
        addMessage(message, true);
        messageInput.value = '';

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message }),
            });

            const data = await response.json();
            // 添加助手回复
            addMessage(data.response);
        } catch (error) {
            console.error('Error:', error);
            addMessage('抱歉，发生了错误，请稍后重试。');
        }
    });
});
</script>

<style>
.message {
    max-width: 80%;
}

.user-message {
    margin-left: auto;
}

.assistant-message {
    margin-right: auto;
}

#chat-messages {
    border: 1px solid #dee2e6;
    border-radius: 0.25rem;
    padding: 1rem;
}
</style>
{% endblock %}
